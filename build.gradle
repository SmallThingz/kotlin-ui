// Standalone builds own their toolchain. Reverb subproject builds inherit its
// existing classloader, avoiding a second Android/Kotlin plugin runtime.
buildscript {
    if (project == rootProject) {
        repositories { google(); mavenCentral(); gradlePluginPortal() }
        dependencies {
            classpath 'com.android.tools.build:gradle:9.4.0'
            classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0'
        }
    }
}

apply plugin: 'com.android.library'
repositories { google(); mavenCentral() }

group = 'smallthingz'
version = '0.1.0'

import org.jetbrains.kotlin.gradle.dsl.JvmTarget
kotlin { compilerOptions { jvmTarget = JvmTarget.JVM_17; freeCompilerArgs.add('-jvm-default=no-compatibility') } }
android {
    namespace = 'smallthingz.ui'
    compileSdk = 37
    defaultConfig { minSdk = 28 }
    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.emoji2:emoji2:1.4.0'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    testImplementation 'junit:junit:4.13.2'
}
