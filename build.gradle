// Standalone builds own their toolchain. Reverb subproject builds inherit its
// existing classloader, avoiding a second Android/Kotlin plugin runtime.
buildscript {
    if (project == rootProject) {
        repositories { google(); mavenCentral(); gradlePluginPortal() }
        dependencies {
            classpath 'com.android.tools.build:gradle:9.4.0'
            classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.3.0'
        }
    }
}

apply plugin: 'com.android.library'
repositories { google(); mavenCentral() }

group = 'smallthingz'
version = '0.1.0'

import org.jetbrains.kotlin.gradle.dsl.JvmTarget
kotlin { compilerOptions { jvmTarget = JvmTarget.JVM_17; freeCompilerArgs.add('-jvm-default=no-compatibility') } }
android {
    namespace = 'smallthingz.ui'
    compileSdk = 37
    defaultConfig {
        minSdk = 28
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.core:core:1.18.0'
    api 'androidx.activity:activity-ktx:1.13.0'
    api 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.10.0'
    implementation 'androidx.savedstate:savedstate:1.4.0'
    implementation 'androidx.emoji2:emoji2:1.4.0'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

// Android starting windows need a packaged color before the Kotlin palette can run.
def amoledSource = file('src/main/kotlin/smallthingz/ui/components/NativeDarkSurfaces.kt')
def amoledColors = file('src/main/res/values/native_default_amoled_colors.xml')
tasks.register('verifyDefaultAmoledBackground') {
    group = 'verification'
    description = 'Check the packaged startup color against the native AMOLED default'
    inputs.files(amoledSource, amoledColors)
    doLast {
        def source = amoledSource.getText('UTF-8')
        def level = source =~ /(?m)^internal const val DEFAULT_AMOLED_BACKGROUND_LEVEL = ([0-9]+)\r?$/
        def maximum = source =~ /(?m)^private const val MAX_DARK_SURFACE_LEVEL = ([0-9]+)f\r?$/
        if (!level.find() || !maximum.find() || level.group(1).toInteger() > Math.min(maximum.group(1).toInteger(), 255)) {
            throw new GradleException("Invalid AMOLED background level in ${amoledSource}")
        }
        def expected = '#' + String.format('%02X', level.group(1).toInteger()) * 3
        def color = amoledColors.getText('UTF-8') =~ /<color name="native_default_amoled_background">([^<]+)<\/color>/
        if (!color.find() || color.group(1) != expected) {
            throw new GradleException("Set native_default_amoled_background in ${amoledColors} to ${expected}")
        }
    }
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyDefaultAmoledBackground')
}
